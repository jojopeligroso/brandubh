<!doctype html>
<html lang="en" data-theme="tokyo-night">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#13141c" />
    <script>
      // Apply the saved theme before first paint to avoid a flash of the default.
      try {
        var t = localStorage.getItem("brandubh.theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="Brandubh — the Irish 7x7 hnefatafl. Play the King's escape or the raiders' hunt against a friend or the AI."
    />
    <title>Brandubh · Irish Hnefatafl</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
