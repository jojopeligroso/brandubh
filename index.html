<!doctype html>
<html lang="en" data-theme="everforest">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2d353b" />
    <script>
      // Apply the saved theme before first paint to avoid a flash. First-time
      // visitors get a weighted default: Everforest 66%, Carved Wood 34%.
      try {
        var t = localStorage.getItem("brandubh.theme");
        if (!t) {
          t = Math.random() < 0.66 ? "everforest" : "carved-wood";
          localStorage.setItem("brandubh.theme", t);
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="Brandubh — the Irish 7x7 hnefatafl. Play the King's escape or the raiders' hunt against a friend or the AI."
    />
    <title>Brandubh · Irish Hnefatafl</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
